<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>제출 완료 · 오니칸</title>
<style>
@font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Regular.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Bold.woff2') format('woff2')}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{background:#FFFFFF;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.stack{display:flex;flex-direction:column;align-items:center;gap:18px;}
/* 마스코트 — Figma 노드 184:14197 크롭/회전 재현 (전체 90% 스케일) */
.illo{width:169.24px;height:155.23px;display:flex;align-items:center;justify-content:center;}
.rot{transform:rotate(-90deg);flex:none;}
.frame{width:155.23px;height:169.24px;position:relative;overflow:hidden;}
.frame img{position:absolute;height:286.97%;width:221.18%;left:-105.52%;top:-14.21%;max-width:none;}
/* 텍스트 */
.text{display:flex;flex-direction:column;align-items:center;gap:9.9px;text-align:center;}
.t1{font-weight:700;font-size:31.68px;line-height:39.6px;color:#1D1D21;}
.t2{font-weight:400;font-size:19.8px;line-height:31.68px;color:#56565E;}
</style>
</head>
<body>
  <div class="page">
    <div class="stack">
      <div class="illo"><div class="rot"><div class="frame"><img src="thanks-mascot.png" alt="오니기리 사장 마스코트"></div></div></div>
      <div class="text">
        <div class="t1">제출 완료!</div>
        <div class="t2">성실한 응답 감사합니다.<br>일본어 공부 앱으로 곧 만나요 🍙</div>
      </div>
    </div>
  </div>
</body>
</html>
