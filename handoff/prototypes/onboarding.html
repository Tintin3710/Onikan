<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>오니칸 온보딩 (연습)</title>
<style>
@font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Regular.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Medium.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:600;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-SemiBold.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Bold.woff2') format('woff2')}
:root{
  --ink:#1D1D21; --body:#56565E; --mute:#8E8E97; --canvas:#FFFFFF; --softer:#F2F2F4;
  --soft:#E8E8EC; --pressed:#DCDCE2; --plate:#EDEDF1; --primary:#EF5112; --primary-pressed:#D2460E;
  --on-primary:#FFFFFF; --secondary:#A3E635; --secondary-deep:#4D7C0F; --shadow:rgba(0,0,0,.05);
}
[data-theme="dark"]{
  --ink:#F7F7F9; --body:#A9A9B2; --mute:#71717A; --canvas:#1D1D21; --softer:#131316;
  --soft:#2B2B31; --pressed:#3E3E45; --plate:#EDEDF1; --primary:#F97316; --primary-pressed:#FA8432;
  --on-primary:#1D1D21; --secondary:#A3E635; --secondary-deep:#A3E635; --shadow:rgba(0,0,0,.4);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{ font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP","Apple SD Gothic Neo",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
.app{ min-height:100dvh; max-width:480px; margin:0 auto; background:var(--softer); color:var(--ink);
  display:flex; flex-direction:column; position:relative; transition:background .25s; }
.scr{ flex:1; display:flex; flex-direction:column; min-height:100dvh; padding:0 20px;
  padding-top:calc(env(safe-area-inset-top) + 12px); padding-bottom:calc(env(safe-area-inset-bottom) + 20px); }

/* header */
.nav{ display:flex; align-items:center; justify-content:space-between; min-height:40px; }
.nav a{ font-size:16px; color:var(--body); text-decoration:none; }
.overline{ font-size:13px; letter-spacing:1px; color:var(--body); margin-top:8px; }

/* CONTINUOUS progress bar (single line, replaces segmented) */
.pbar{ height:6px; background:var(--pressed); border-radius:999px; overflow:hidden; margin-top:14px; }
.pbar > i{ display:block; height:100%; background:var(--ink); border-radius:999px; transition:width .35s ease; }
.pbar.thick{ height:8px; }
.center > .pbar{ align-self:stretch; }

/* generic */
.grow{ flex:1; }
.center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; }
.cta{ width:100%; min-height:56px; border:none; border-radius:999px; background:var(--primary); color:var(--on-primary);
  font-size:18px; font-weight:600; font-family:inherit; cursor:pointer; }
.cta:active{ background:var(--primary-pressed); }
.plate{ background:var(--plate); border-radius:24px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.plate img{ display:block; }

/* intro / tutorial */
.mascot-lg{ width:150px; height:180px; }
.mascot-lg img{ width:100%; height:100%; object-fit:contain; }
.speech{ font-size:19px; line-height:1.5; font-weight:500; color:var(--ink); }
.by{ font-size:15px; color:var(--body); }
.tut-title{ font-size:30px; font-weight:700; }
.tut-sub{ font-size:16px; line-height:1.55; color:var(--body); }

/* study card */
.card{ flex:1; background:var(--canvas); border-radius:24px; box-shadow:0 6px 14px var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  margin:12px 0 16px; padding:32px 24px; min-height:0; }
.word{ font-size:64px; font-weight:700; line-height:1; color:var(--ink); }
.reading{ font-size:20px; font-weight:500; color:var(--body); margin-top:-4px; }
.meaning{ font-size:30px; font-weight:700; color:var(--ink); }
.hint{ font-size:15px; color:var(--body); }
.grades{ display:flex; gap:10px; }
.grade{ flex:1; min-height:60px; border-radius:999px; font-size:17px; font-weight:600; font-family:inherit; cursor:pointer; }
.grade.no{ background:transparent; border:1.5px solid var(--pressed); color:var(--ink); }
.grade.yes{ background:var(--ink); color:var(--softer); border:none; }

/* reward */
.result-title{ font-size:32px; font-weight:700; }
.mascot-md{ width:150px; height:130px; margin:8px auto 0; }
.mascot-md img{ width:100%; height:100%; object-fit:contain; }
.reward-card{ background:var(--canvas); border-radius:20px; box-shadow:0 6px 14px var(--shadow);
  display:flex; align-items:center; gap:16px; padding:16px 18px; margin-top:16px; }
.reward-card .tile{ width:64px; height:64px; border-radius:16px; flex:none; }
.reward-card .tile img{ width:52px; height:52px; object-fit:contain; }
.reward-card .col{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.reward-card .ov{ font-size:13px; letter-spacing:1px; color:var(--body); }
.reward-card .nm{ font-size:24px; font-weight:700; }
.reward-card .ds{ font-size:14px; color:var(--body); }
/* grouped recipe-progress block (fixes the detached/segmented bar) */
.recipe{ margin-top:16px; }
.recipe .top{ display:flex; align-items:baseline; justify-content:space-between; }
.recipe .nm{ font-size:22px; font-weight:700; }
.recipe .frac{ font-size:14px; font-weight:600; color:var(--body); font-variant-numeric:tabular-nums; }

/* rule */
.rule-tile{ width:150px; height:150px; border-radius:28px; margin:0 auto; }
.rule-tile img{ width:112px; height:112px; object-fit:contain; }
.rule-name{ font-size:34px; font-weight:700; }
.rule-sub{ font-size:16px; line-height:1.55; color:var(--body); }

/* receipt */
.receipt{ background:var(--canvas); border-radius:12px; box-shadow:0 6px 14px var(--shadow); padding:28px 22px; }
.receipt .shop{ text-align:center; font-size:16px; font-weight:600; letter-spacing:3px; }
.receipt .date{ text-align:center; font-size:14px; color:var(--body); margin-top:6px; font-variant-numeric:tabular-nums; }
.dash{ border-top:1px dashed var(--pressed); margin:16px 0; }
.rrow{ display:flex; justify-content:space-between; align-items:center; font-size:16px; padding:8px 0; }
.rrow + .rrow{ border-top:1px solid var(--soft); }
.rrow .lb{ color:var(--body); }
.rrow .num{ font-variant-numeric:tabular-nums; }
.badge{ width:24px; height:24px; border-radius:999px; background:var(--secondary); display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; margin-left:8px; }
.rcp{ display:flex; justify-content:space-between; align-items:baseline; }
.rcp .nm{ font-size:18px; font-weight:700; }
.rcp .frac{ font-size:14px; font-weight:600; color:var(--body); font-variant-numeric:tabular-nums; }
.receipt .foot{ text-align:center; font-size:14px; color:var(--body); margin-top:16px; line-height:1.5; }
.receipt .thanks{ text-align:center; font-size:13px; letter-spacing:2px; color:var(--body); margin-top:12px; }
.note{ text-align:center; font-size:15px; line-height:1.55; color:var(--body); margin:18px 0; }

/* floating review controls */
.ctrls{ position:fixed; top:calc(env(safe-area-inset-top) + 8px); right:10px; display:flex; gap:6px; z-index:50; }
.ctrls button{ width:34px; height:34px; border-radius:999px; border:1px solid var(--pressed); background:var(--canvas);
  color:var(--ink); font-size:15px; cursor:pointer; opacity:.9; }
</style>
</head>
<body data-theme="light">
<div class="ctrls">
  <button id="restart" title="처음부터">⟲</button>
  <button id="theme" title="테마">🌙</button>
</div>
<div class="app" id="app"></div>

<script>
const M="../assets/mascot.png", RICE="../ingredients/rice.png", ONI="../onigiri/01-tuna-mayo.png";
const DECK=[
  {w:"秋",r:"あき",m:"가을"},{w:"水",r:"みず",m:"물"},{w:"山",r:"やま",m:"산"},
  {w:"川",r:"かわ",m:"강"},{w:"空",r:"そら",m:"하늘"},
];
const app=document.getElementById("app");
let s={step:"intro", wi:0, done:0, revealed:false};

function bar(pct,thick){ return `<div class="pbar${thick?' thick':''}"><i style="width:${pct}%"></i></div>`; }
const back=(skip)=>`<div class="nav"><a href="#" data-back>‹ 뒤로</a>${skip?'<a href="#" data-skip>건너뛰기</a>':'<span></span>'}</div>`;

function render(){
  let h="";
  if(s.step==="intro"){
    h=`<div class="scr">
      <div class="center">
        <div class="plate mascot-lg"><img src="${M}"></div>
        <div class="speech">왔네.<br>여긴 오니기리 가게야.<br>단어를 외우면 재료가 쌓여.</div>
        <div class="by">— 사장</div>
      </div>
      <button class="cta" data-next="tutorial">시작하기</button>
    </div>`;
  } else if(s.step==="tutorial"){
    h=`<div class="scr">
      ${back(true)}
      <div class="overline">튜토리얼</div>
      <div class="center">
        <div class="plate mascot-lg"><img src="${M}"></div>
        <div class="tut-title">먼저 5개만.</div>
        <div class="tut-sub">짧게 공부하고, 재료를 얻는<br>흐름을 먼저 연습해 봐요.</div>
      </div>
      <button class="cta" data-next="study">시작</button>
    </div>`;
  } else if(s.step==="study"){
    const c=DECK[s.wi]; const pct=Math.round(s.done/DECK.length*100);
    const front=`<div class="word">${c.w}</div><div class="hint">탭해서 뜻 확인</div>`;
    const reveal=`<div class="word">${c.w}</div><div class="reading">${c.r}</div><div class="meaning">${c.m}</div>`;
    h=`<div class="scr">
      ${back(false)}
      ${bar(pct)}
      <div class="card" ${s.revealed?'':'data-reveal'}>${s.revealed?reveal:front}</div>
      ${ s.revealed
        ? `<div class="grades"><button class="grade no" data-grade>아직이에요</button><button class="grade yes" data-grade>외웠어요</button></div>`
        : `<button class="cta" data-reveal>뜻 보기</button>` }
    </div>`;
  } else if(s.step==="reward"){
    h=`<div class="scr">
      ${back(false)}
      <div class="overline">다 했어요</div>
      <div class="grow" style="display:flex;flex-direction:column;justify-content:center">
        <div class="mascot-md"><img src="${M}"></div>
        <div class="reward-card">
          <div class="plate tile"><img src="${RICE}"></div>
          <div class="col"><span class="ov">새 재료</span><span class="nm">쌀</span><span class="ds">학습 1회를 마치면 재료 1개를 받아요.</span></div>
        </div>
        <div class="recipe">
          <div class="top"><span class="nm">참치마요</span><span class="frac">1 / 4</span></div>
          ${bar(25)}
        </div>
      </div>
      <button class="cta" data-next="rule">계속</button>
    </div>`;
  } else if(s.step==="rule"){
    h=`<div class="scr">
      ${back(false)}
      <div class="overline">완성 규칙</div>
      <div class="center">
        <div class="plate rule-tile"><img src="${ONI}"></div>
        <div class="rule-name">참치마요</div>
        ${bar(100,true)}
        <div class="rule-sub">재료 4개가 모이면 완성돼요.<br>완성한 메뉴는 도감에 쌓여요.</div>
      </div>
      <button class="cta" data-next="receipt">계속</button>
    </div>`;
  } else if(s.step==="receipt"){
    h=`<div class="scr">
      ${back(false)}
      <div class="grow" style="display:flex;flex-direction:column;justify-content:center">
        <div class="receipt">
          <div class="shop">ONIGIRI SHOP</div>
          <div class="date">2026.08.18</div>
          <div class="dash"></div>
          <div class="rrow"><span class="lb">새로 배운 단어</span><span class="num">5</span></div>
          <div class="rrow"><span class="lb">아직이라고 표시한 단어</span><span class="num">0</span></div>
          <div class="rrow"><span class="lb">받은 재료</span><span>쌀<span class="badge"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1D1D21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></span></div>
          <div class="dash"></div>
          <div class="rcp"><span class="nm">참치마요</span><span class="frac">1 / 4</span></div>
          ${bar(25)}
          <div class="foot">학습을 마치면 매번 영수증이 나와요.</div>
          <div class="thanks">THANK YOU · 연습</div>
        </div>
        <div class="note">연습 결과는 저장되지 않아요.<br>실제 학습을 마치면 보상과 기록이 남아요.</div>
      </div>
      <button class="cta" data-next="done">시작하기</button>
    </div>`;
  } else if(s.step==="done"){
    h=`<div class="scr"><div class="center">
      <div class="plate mascot-lg"><img src="${M}"></div>
      <div class="tut-title">준비 끝!</div>
      <div class="tut-sub">이제 진짜 오늘의 단어를 시작해요.</div>
    </div><button class="cta" id="again">처음부터 다시</button></div>`;
  }
  app.innerHTML=h;
}

app.addEventListener("click",e=>{
  const t=e.target.closest("[data-next],[data-reveal],[data-grade],[data-back],[data-skip],#again");
  if(!t) return;
  e.preventDefault();
  if(t.id==="again"){ s={step:"intro",wi:0,done:0,revealed:false}; return render(); }
  if(t.hasAttribute("data-back")){ back1(); return; }
  if(t.hasAttribute("data-skip")){ s.step="done"; return render(); }
  if(t.hasAttribute("data-reveal")){ if(s.step==="study"&&!s.revealed){ s.revealed=true; render(); } return; }
  if(t.hasAttribute("data-grade")){
    s.done++; s.revealed=false; s.wi++;
    if(s.done>=DECK.length){ s.step="reward"; s.wi=0; }
    return render();
  }
  if(t.dataset.next){ s.step=t.dataset.next; if(s.step==="study"){s.wi=0;s.done=0;s.revealed=false;} return render(); }
});
function back1(){
  const order=["intro","tutorial","study","reward","rule","receipt","done"];
  if(s.step==="study"&&s.revealed){ s.revealed=false; return render(); }
  const i=order.indexOf(s.step); if(i>0){ s.step=order[i-1]; if(s.step==="study"){s.revealed=false;} render(); }
}
document.getElementById("restart").onclick=()=>{ s={step:"intro",wi:0,done:0,revealed:false}; render(); };
document.getElementById("theme").onclick=()=>{ const b=document.body; const d=b.dataset.theme==="dark"; b.dataset.theme=d?"light":"dark"; document.getElementById("theme").textContent=d?"🌙":"☀️"; };
render();
</script>
</body>
</html>
