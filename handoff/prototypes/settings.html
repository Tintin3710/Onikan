<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>오니칸 설정 (연습)</title>
<style>
@font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Regular.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:500;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Medium.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:600;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-SemiBold.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Bold.woff2') format('woff2')}
@font-face{font-family:'Pretendard';font-weight:800;font-display:swap;src:url('../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-ExtraBold.woff2') format('woff2')}
:root{
  --ink:#1D1D21; --body:#56565E; --mute:#8E8E97; --canvas:#FFFFFF; --softer:#F2F2F4;
  --soft:#E8E8EC; --pressed:#DCDCE2; --plate:#EDEDF1; --primary:#EF5112; --primary-pressed:#D2460E;
  --on-primary:#FFFFFF; --secondary:#A3E635; --shadow:rgba(0,0,0,.05);
}
[data-theme="dark"]{
  --ink:#F7F7F9; --body:#A9A9B2; --mute:#71717A; --canvas:#1D1D21; --softer:#131316;
  --soft:#2B2B31; --pressed:#3E3E45; --plate:#2B2B31; --primary:#F97316; --primary-pressed:#FA8432;
  --on-primary:#1D1D21; --secondary:#A3E635; --shadow:rgba(0,0,0,.4);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; }
body{ font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
.app{ min-height:100dvh; max-width:480px; margin:0 auto; background:var(--softer); color:var(--ink);
  display:flex; flex-direction:column; position:relative; transition:background .25s; }

/* scroll region */
.root{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.scr{ display:flex; flex-direction:column; min-height:100%;
  padding:0 20px calc(env(safe-area-inset-bottom) + 24px);
  padding-top:calc(env(safe-area-inset-top) + 8px); }

/* header / titles */
.nav{ display:flex; align-items:center; min-height:44px; }
.back{ display:inline-flex; align-items:center; gap:2px; font-size:16px; color:var(--ink);
  background:none; border:none; padding:8px 6px 8px 0; cursor:pointer; font-family:inherit; }
.back svg{ width:11px; height:20px; }
.title{ font-size:34px; font-weight:800; letter-spacing:-.02em; margin:8px 0 20px; }
.dtitle{ font-size:29px; font-weight:800; letter-spacing:-.02em; margin:4px 0 26px; }

/* cards + rows (SettingCard / SettingRow) */
.card{ background:var(--canvas); border-radius:22px; box-shadow:0 6px 16px var(--shadow); margin-bottom:16px; overflow:hidden; }
.row{ display:flex; align-items:center; gap:12px; min-height:64px; padding:14px 20px; cursor:pointer; position:relative; }
.row:active{ background:var(--softer); }
.row + .row::before{ content:""; position:absolute; top:0; left:20px; right:0; height:1px; background:var(--soft); }
.row .lb{ font-size:17px; font-weight:500; color:var(--ink); flex:none; }
.row .sp{ flex:1; }
.row .val{ font-size:15px; color:var(--body); text-align:right; }
.row .chev{ color:var(--mute); font-size:20px; flex:none; margin-left:2px; }

/* section (detail pages) — SettingSection */
.sec{ margin-bottom:30px; }
.shead{ font-size:19px; font-weight:700; color:var(--ink); }
.sdesc{ font-size:14.5px; line-height:1.55; color:var(--body); margin-top:6px; }
.sbody{ margin-top:16px; }

/* level chips */
.chips{ display:flex; gap:10px; flex-wrap:wrap; }
.chip{ min-width:58px; text-align:center; padding:13px 4px; border-radius:999px; border:1.5px solid var(--pressed);
  background:transparent; font-size:16px; font-weight:600; color:var(--body); cursor:pointer; font-family:inherit; flex:1; transition:.12s; }
.chip.on{ background:var(--ink); border-color:var(--ink); color:var(--canvas); }
.chip:active{ transform:scale(.96); }

/* stepper */
.stepper{ display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:var(--canvas); border-radius:20px; padding:14px 18px; box-shadow:0 6px 16px var(--shadow); }
.stepper.plain{ box-shadow:none; padding:6px 0; background:transparent; }
.stepbtn{ width:52px; height:52px; border-radius:999px; border:none; background:var(--soft); color:var(--ink);
  font-size:26px; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:inherit; }
.stepbtn:active{ background:var(--pressed); }
.stepbtn[disabled]{ opacity:.35; }
.stepval{ font-size:22px; font-weight:700; color:var(--ink); min-width:64px; text-align:center; }
.warn{ margin-top:12px; font-size:13.5px; font-weight:500; color:var(--primary); }

/* toggle rows (inside card) */
.trow{ display:flex; align-items:flex-start; gap:14px; padding:18px 20px; position:relative; }
.trow + .trow::before{ content:""; position:absolute; top:0; left:20px; right:20px; height:1px; background:var(--soft); }
.trow .tx{ flex:1; }
.trow .tl{ font-size:17px; font-weight:500; color:var(--ink); }
.trow.off .tl, .trow.off .td{ opacity:.4; }
.trow .td{ font-size:13.5px; line-height:1.5; color:var(--body); margin-top:4px; }
.sw{ width:52px; height:32px; border-radius:999px; background:var(--pressed); flex:none; position:relative;
  cursor:pointer; transition:background .2s; margin-top:2px; }
.sw::after{ content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:999px;
  background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s; }
.sw.on{ background:var(--ink); }
.sw.on::after{ transform:translateX(20px); }
.sw.dis{ opacity:.4; pointer-events:none; }

/* primary CTA (backup) */
.cta{ width:100%; min-height:56px; border:none; border-radius:999px; background:var(--primary); color:var(--on-primary);
  font-size:17px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:6px; }
.cta:active{ background:var(--primary-pressed); }
.note{ font-size:13px; line-height:1.6; color:var(--mute); text-align:center; margin-top:18px; }

.ver{ font-size:13px; color:var(--mute); margin:6px 4px 22px; }

/* bottom tab bar */
.tabbar{ display:flex; background:var(--canvas); border-top:1px solid var(--soft);
  padding:8px 0 calc(env(safe-area-inset-bottom) + 6px); }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--mute);
  background:none; border:none; cursor:pointer; font-family:inherit; }
.tab svg{ width:26px; height:26px; }
.tab span{ font-size:11px; font-weight:500; }
.tab.on{ color:var(--primary); }

/* floating dark preview toggle (prototype affordance) */
.moon{ position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:14px; z-index:20;
  width:44px; height:44px; border-radius:999px; border:none; background:var(--canvas); color:var(--ink);
  box-shadow:0 4px 12px var(--shadow); font-size:19px; cursor:pointer; }

.toast{ position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(10px);
  background:var(--ink); color:var(--canvas); font-size:14px; font-weight:500; padding:12px 18px;
  border-radius:999px; opacity:0; pointer-events:none; transition:.25s; z-index:30; max-width:80%; text-align:center; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app" id="app">
  <main class="root" id="root"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<button class="moon" id="moon" aria-label="다크 미리보기">🌙</button>
<div class="toast" id="toast"></div>

<script>
// ── state (mirrors ~/stores/SettingsStore) ───────────────────────────────
const LV=['N5','N4','N3','N2','N1'];
const DAILY_MIN=5, DAILY_MAX=50, HIGH=30;      // SettingsStore constants
const SPEED_MIN=0.5, SPEED_MAX=1.5, SPEED_STEP=0.1;
const KEY='onikan.settings.proto.v1';
const DEF={ levels:['N5'], daily:12, tts:true, autoplay:true, speed:0.9 };

let s = load();
let screen = 'main';                            // main | learn | pronun | backup

function load(){
  try{ const j=JSON.parse(localStorage.getItem(KEY)); if(j) return {...DEF,...j}; }catch(e){}
  return {...DEF};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }

// ── helpers ──────────────────────────────────────────────────────────────
const CHEV='›';
const levelsLabel = ()=> LV.filter(l=>s.levels.includes(l)).join('·');
const learnSummary = ()=> `${levelsLabel()} · 하루 ${s.daily}개`;
const pronunSummary= ()=> s.tts ? `켜짐 · ${s.speed.toFixed(1)}x` : '꺼짐';

function backBar(){
  return `<div class="nav"><button class="back" data-go="main">
    <svg viewBox="0 0 11 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1 1.5 10l8 9"/></svg>뒤로</button></div>`;
}

// ── screens ────────────────────────────────────────────────────────────────
function mainView(){
  return `<div class="scr">
    <div style="height:calc(env(safe-area-inset-top) + 8px)"></div>
    <h1 class="title">설정</h1>

    <div class="card">
      <div class="row" data-go="learn">
        <span class="lb">학습 설정</span><span class="sp"></span>
        <span class="val">${learnSummary()}</span><span class="chev">${CHEV}</span>
      </div>
      <div class="row" data-go="pronun">
        <span class="lb">발음 설정</span><span class="sp"></span>
        <span class="val">${pronunSummary()}</span><span class="chev">${CHEV}</span>
      </div>
    </div>

    <div class="card">
      <div class="row" data-go="backup">
        <span class="lb">데이터 백업</span><span class="sp"></span>
        <span class="val">JSON</span><span class="chev">${CHEV}</span>
      </div>
      <div class="row" data-toast="앱 정보 · 라이선스 · 출처 — 실제 앱에서 이동해요">
        <span class="lb">앱 정보</span><span class="sp"></span>
        <span class="chev">${CHEV}</span>
      </div>
    </div>

    <div class="ver">앱 버전 5.273.0 · 최신버전</div>
  </div>`;
}

function learnView(){
  const hi = s.daily > HIGH;
  return `<div class="scr">
    ${backBar()}
    <h1 class="dtitle">학습 설정</h1>

    <div class="sec">
      <div class="shead">학습 레벨</div>
      <div class="sdesc">학습할 JLPT 레벨을 선택해주세요.<br>최소 1개 이상 선택해야 합니다.</div>
      <div class="sbody"><div class="chips">
        ${LV.map(l=>`<button class="chip ${s.levels.includes(l)?'on':''}" data-lv="${l}">${l}</button>`).join('')}
      </div></div>
    </div>

    <div class="sec">
      <div class="shead">하루 새 단어</div>
      <div class="sdesc">하루에 새롭게 출제할 단어 수입니다.<br>${DAILY_MIN}~${DAILY_MAX}개까지 설정할 수 있습니다.</div>
      <div class="sbody">
        <div class="stepper">
          <button class="stepbtn" data-daily="-1" ${s.daily<=DAILY_MIN?'disabled':''}>−</button>
          <span class="stepval">${s.daily}개</span>
          <button class="stepbtn" data-daily="1" ${s.daily>=DAILY_MAX?'disabled':''}>＋</button>
        </div>
        ${hi?`<div class="warn">고강도 — 복습 누적이 빠르게 늘어요.</div>`:''}
      </div>
    </div>
  </div>`;
}

function pronunView(){
  const off = !s.tts;
  return `<div class="scr">
    ${backBar()}
    <h1 class="dtitle">발음 설정</h1>

    <div class="card">
      <div class="trow">
        <div class="tx"><div class="tl">발음 듣기</div><div class="td">일본어 단어의 발음을 재생합니다.</div></div>
        <div class="sw ${s.tts?'on':''}" data-tts></div>
      </div>
      <div class="trow ${off?'off':''}">
        <div class="tx"><div class="tl">뜻 확인 시 자동 재생</div><div class="td">뜻을 확인하면 단어의 발음을 자동으로 재생합니다.</div></div>
        <div class="sw ${s.tts&&s.autoplay?'on':''} ${off?'dis':''}" data-autoplay></div>
      </div>
    </div>

    <div class="sec" style="margin-top:24px; ${off?'opacity:.4;pointer-events:none;':''}">
      <div class="shead">재생 속도</div>
      <div class="sbody">
        <div class="stepper">
          <button class="stepbtn" data-speed="-1" ${s.speed<=SPEED_MIN+1e-9?'disabled':''}>−</button>
          <span class="stepval">${s.speed.toFixed(1)}x</span>
          <button class="stepbtn" data-speed="1" ${s.speed>=SPEED_MAX-1e-9?'disabled':''}>＋</button>
        </div>
      </div>
    </div>
  </div>`;
}

function backupView(){
  return `<div class="scr">
    ${backBar()}
    <h1 class="dtitle">데이터 백업</h1>

    <div class="sec">
      <div class="shead">학습 기록 내보내기</div>
      <div class="sdesc">학습 기록을 JSON 파일로 내보낼 수 있습니다.<br>내보낸 파일은 저장하거나 다른 앱으로 공유할 수 있어요.</div>
      <div class="sbody">
        <button class="cta" data-export>백업 내보내기 (JSON)</button>
      </div>
    </div>

    <div class="note">모든 학습 데이터는 이 기기에만 저장돼요.<br>외부로 전송하지 않습니다.</div>
  </div>`;
}

// ── tab bar ────────────────────────────────────────────────────────────────
const ICONS = {
  today: '<path d="M12 4c.5 0 .96.26 1.22.7l6.5 11.1c.6 1.03-.14 2.3-1.32 2.3H5.6c-1.18 0-1.92-1.27-1.32-2.3l6.5-11.1C11.04 4.26 11.5 4 12 4Z"/>',
  menu:  '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16"/>',
  stats: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  set:   '<circle cx="7" cy="8" r="2"/><path d="M9 8h11M4 8h1"/><circle cx="16" cy="16" r="2"/><path d="M14 16H4M18 16h2"/>'
};
function tabbar(){
  const tabs=[['today','오늘'],['menu','메뉴'],['stats','기록'],['set','설정']];
  document.getElementById('tabbar').innerHTML = tabs.map(([k,label])=>
    `<button class="tab ${k==='set'?'on':''}" data-tab="${label}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>
      <span>${label}</span></button>`).join('');
}

// ── render + events ─────────────────────────────────────────────────────────
function render(){
  const views={ main:mainView, learn:learnView, pronun:pronunView, backup:backupView };
  document.getElementById('root').innerHTML = views[screen]();
  document.getElementById('tabbar').style.display = screen==='main' ? 'flex' : 'none';
  document.getElementById('root').scrollTop = 0;
}
function go(next){ screen=next; render(); }

let toastT;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 1900);
}

document.getElementById('app').addEventListener('click', (e)=>{
  const t=e.target.closest('[data-go],[data-lv],[data-daily],[data-speed],[data-tts],[data-autoplay],[data-export],[data-toast],[data-tab]');
  if(!t) return;

  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.toast!==undefined && t.dataset.toast){ toast(t.dataset.toast); return; }
  if(t.dataset.tab){ if(t.dataset.tab!=='설정') toast(`${t.dataset.tab} 탭 — 이 연습에선 설정만 열려요`); return; }

  if(t.dataset.lv){                                   // level multi-select, min 1
    const lv=t.dataset.lv, has=s.levels.includes(lv);
    if(has && s.levels.length===1){ toast('최소 1개 이상 선택해야 해요'); return; }
    s.levels = has ? s.levels.filter(x=>x!==lv) : [...s.levels, lv];
    save(); render(); return;
  }
  if(t.dataset.daily){
    const next=s.daily + (+t.dataset.daily);
    if(next<DAILY_MIN||next>DAILY_MAX) return;
    s.daily=next; save(); render(); return;
  }
  if(t.dataset.speed){
    let next = s.speed + (+t.dataset.speed)*SPEED_STEP;
    next = Math.round(next*10)/10;
    if(next<SPEED_MIN-1e-9||next>SPEED_MAX+1e-9) return;
    s.speed=next; save(); render(); return;
  }
  if(t.hasAttribute('data-tts')){ s.tts=!s.tts; save(); render(); return; }
  if(t.hasAttribute('data-autoplay')){ if(!s.tts) return; s.autoplay=!s.autoplay; save(); render(); return; }
  if(t.hasAttribute('data-export')){ toast('백업 파일을 생성했어요 (연습)'); return; }
});

// dark preview toggle (prototype only — not part of the settings UI)
document.getElementById('moon').addEventListener('click', ()=>{
  const app=document.documentElement;
  const dark = app.getAttribute('data-theme')==='dark';
  app.setAttribute('data-theme', dark?'light':'dark');
  document.getElementById('moon').textContent = dark?'🌙':'☀️';
});

tabbar();
render();
</script>
</body>
</html>
