<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오니칸 · 복습 완료 (시안)</title>
<!--
  복습 완료 화면 시안.
  · 복습 = 오늘 학습에서 '아직이에요' 누른 단어만 모아 다시 보는 세션.
  · 골격은 회독 완료(CompletionCard)와 동일: 일러스트 → 완료 타이틀 → 부제(독려) → 지표 → CTA.
  · 회독 완료와 다른 점 2가지:
      ① 지표는 '학습 시간·단골기록' 대신 → 복습한 N · 넘김 M (2칸).
      ② 축하 강도는 한 단계 낮게(폭죽/재료 없음). 성취가 아니라 '정리 완료'의 뉘앙스.
  · CTA는 [홈으로] 하나. (회독 완료의 서브 링크 없음 — 복습은 마무리 동선)
  · 헤드라인/독려 카피 후보는 아래 data-copy 주석 참고. 현재는 all-clear(넘김 0) 상태.
  · Figma 인증이 세션에서 막혀 있어 첨부 레퍼런스(413-7540) + 리포지토리 에셋으로 구성한 시안.
-->
<style>
  @font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:url('../../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Regular.woff2') format('woff2')}
  @font-face{font-family:'Pretendard';font-weight:500;font-display:swap;src:url('../../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Medium.woff2') format('woff2')}
  @font-face{font-family:'Pretendard';font-weight:600;font-display:swap;src:url('../../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-SemiBold.woff2') format('woff2')}
  @font-face{font-family:'Pretendard';font-weight:700;font-display:swap;src:url('../../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Bold.woff2') format('woff2')}
  @font-face{font-family:'Pretendard';font-weight:800;font-display:swap;src:url('../../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-ExtraBold.woff2') format('woff2')}

  :root{
    --ink:#1D1D21; --on-ink:#F7F7F9; --body:#56565E; --mute:#8E8E97;
    --canvas:#FFFFFF; --page:#F2F2F4; --soft:#E8E8EC; --pressed:#DCDCE2; --plate:#EDEDF1;
    --primary:#EF5112; --secondary:#A3E635;
    --radius-card:24px; --radius-pill:999px;
    --shadow:0 6px 14px rgba(30,25,20,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#c9c6c1;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100dvh}

  .device{width:390px;height:844px;max-width:100vw;max-height:100dvh;position:relative;overflow:hidden;background:var(--page);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
  @media(max-width:420px){.device{height:100dvh;box-shadow:none}}

  .statusbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:15px;font-weight:600}
  .statusbar .r{font-weight:500}

  .topnav{height:52px;flex:none;display:flex;align-items:center;padding:0 8px}
  .topnav .close{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer}

  /* 본문: 세로 중앙 정렬, 좌우 16px 마진 */
  .body{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 16px 0;overflow:hidden}

  /* 일러스트 (복습 = 조용히 다시 훑어본 사장) */
  .hero{position:relative;width:220px;height:220px;margin-top:18px;flex:none;display:flex;align-items:center;justify-content:center}
  .hero .glow{position:absolute;inset:8px;border-radius:999px;background:radial-gradient(circle at 50% 42%, #FDECDF 0%, rgba(253,236,223,0) 68%)}
  .hero img{position:relative;width:184px;height:184px;object-fit:contain}
  /* 작은 꽃/축하 악센트 (레퍼런스의 붉은 꽃 뉘앙스) */
  .hero .fl{position:absolute;font-size:16px;line-height:1;opacity:.9}
  .hero .fl.a{top:26px;left:20px;transform:rotate(-12deg)}
  .hero .fl.b{top:52px;right:22px;transform:rotate(10deg);font-size:13px}
  .hero .fl.c{bottom:34px;left:34px;font-size:12px;transform:rotate(6deg)}

  .h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:14px 0 0}
  .sub{font-size:15px;color:var(--body);line-height:22px;margin:10px 0 0;max-width:280px}
  .sub b{color:var(--ink);font-weight:700}

  /* 지표 2칸 (복습한 N · 넘김 M) */
  .stats{display:flex;width:100%;background:var(--canvas);border-radius:var(--radius-card);box-shadow:var(--shadow);margin-top:26px;overflow:hidden}
  .stats .cell{flex:1;padding:18px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .stats .cell + .cell{border-left:1px solid var(--soft)}
  .stats .lab{font-size:13px;color:var(--body);font-weight:500}
  .stats .num{font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .stats .num.ok{color:var(--primary)}   /* 복습한 = 브랜드 오렌지(성취) */
  .stats .num.left{color:var(--ink)}      /* 넘김 = 잉크(중립) */
  .stats .num small{font-size:15px;font-weight:700;color:var(--mute);margin-left:2px}

  .grow{flex:1;min-height:16px}

  /* CTA: 홈으로 (잉크 필) */
  .cta{width:100%;min-height:56px;border-radius:var(--radius-pill);border:none;background:var(--ink);color:var(--on-ink);
    font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-bottom:22px}
</style>
</head>
<body>
  <div class="device">
    <div class="statusbar"><span>9:41</span><span class="r">5G · 92%</span></div>

    <div class="topnav">
      <button class="close" aria-label="닫기"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#1D1D21" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="body">
      <div class="hero">
        <div class="glow"></div>
        <span class="fl a">🌸</span>
        <span class="fl b">🌸</span>
        <span class="fl c">🌸</span>
        <img src="assets/review-mascot.png" alt="복습을 마친 사장">
      </div>

      <!-- data-copy 후보:
           헤드라인: "복습 완료!" (확정 추천)
           독려 부제 후보 ▸ ① "남겨둔 12개, 다시 다 외웠어. 수고했어!"  (all-clear, 추천)
                          ② "아직이던 단어, 오늘 깔끔하게 정리했네. 수고했어!"
                          ③ "여기까지 온 게 실력이야. 수고했어!"
           넘김이 남았을 때 부제 ▸ "9개는 외웠고, 3개는 다음에 또 보자. 수고했어!" -->
      <h1 class="h1">복습 완료!</h1>
      <p class="sub">남겨둔 <b>12개</b>, 다시 다 외웠어.<br>수고했어!</p>

      <div class="stats">
        <div class="cell">
          <span class="lab">복습한</span>
          <span class="num ok">12<small>개</small></span>
        </div>
        <div class="cell">
          <span class="lab">넘김</span>
          <span class="num left">0<small>개</small></span>
        </div>
      </div>

      <div class="grow"></div>

      <button class="cta">홈으로</button>
    </div>
  </div>
</body>
</html>
