<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오니칸 · 복습 완료</title>
<!--
  복습 완료 화면 — Figma 최종본(413-7540) 반영.
  · 복습 = 오늘 학습에서 '아직이에요' 누른 단어만 모아 다시 보는 세션.
  · 골격: 일러스트(합장 사장 + 주먹밥/차 + 붉은 매화) → 타이틀 → 독려 부제 → 지표 2칸 → 홈으로 CTA.
  · 지표: 완료 N · 넘김 M (숫자 위 / 라벨 아래, 잉크 색, 오렌지 강조 없음).
  · 페이지 배경 흰색, 지표 카드 fill #FAFBFC(테두리 없음), CTA는 잉크 pill(좌우 26px).
  · 타이포: 타이틀 Pretendard JP Bold 24/32.
  · Figma 노드/토큰 매핑: 413:7644 타이틀, 413:7645 부제, 413:7656/7657 완료, 413:7668/7669 넘김,
    413:7637 일러스트(export 2×), 413:7694 홈으로. (파티클 413:7544는 이 상태에서 hidden)
  · ⚠️ Figma 목업 값: 부제 "12개" vs 완료 지표 "20개"가 불일치(디자이너 placeholder). 원본 그대로 반영함.
-->
<style>
  @font-face{font-family:'Pretendard JP';font-weight:400;font-display:swap;src:url('../../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Regular.woff2') format('woff2')}
  @font-face{font-family:'Pretendard JP';font-weight:500;font-display:swap;src:url('../../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Medium.woff2') format('woff2')}
  @font-face{font-family:'Pretendard JP';font-weight:600;font-display:swap;src:url('../../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-SemiBold.woff2') format('woff2')}
  @font-face{font-family:'Pretendard JP';font-weight:700;font-display:swap;src:url('../../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Bold.woff2') format('woff2')}

  :root{
    --ink:#1D1D21; --on-ink:#F7F7F9; --body:#56565E; --mute:#8E8E97;
    --canvas:#FFFFFF; --surface:#FAFBFC; --soft:#E8E8EC; --pressed:#DCDCE2;
    --radius-card:16px; --radius-pill:999px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#c9c6c1;font-family:'Pretendard JP',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100dvh}

  .device{width:390px;height:844px;max-width:100vw;max-height:100dvh;position:relative;overflow:hidden;background:var(--canvas);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
  @media(max-width:420px){.device{height:100dvh;box-shadow:none}}

  .statusbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:15px;font-weight:600}
  .statusbar .r{font-weight:500}

  /* 본문: 세로 정렬, 요소별로 폭이 달라 각자 중앙 정렬 */
  .body{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 0 calc(env(safe-area-inset-bottom) + 26px)}

  /* 일러스트 (합장 사장 · 288 정사각, 흰 배경에 그대로 얹힘) */
  .illus{width:288px;height:288px;margin-top:46px;flex:none}
  .illus img{width:100%;height:100%;object-fit:contain;display:block}

  .title{font-size:24px;font-weight:700;line-height:32px;letter-spacing:0;margin:16px 0 0}
  .sub{font-size:14px;line-height:20px;color:var(--body);margin:5px 0 0;padding:0 20px}

  /* 지표 2칸 — 숫자 위 / 라벨 아래 */
  .metrics{display:flex;gap:8px;width:310px;margin-top:24px}
  .metric{flex:1;background:var(--surface);border-radius:var(--radius-card);height:72px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .metric .num{font-size:20px;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
  .metric .lab{font-size:13px;font-weight:500;line-height:1;color:var(--body)}

  .grow{flex:1;min-height:20px}

  /* CTA: 홈으로 (잉크 pill · 좌우 26px · 56px) */
  .cta{width:338px;height:56px;border-radius:var(--radius-pill);border:none;background:var(--ink);color:var(--on-ink);
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div class="device">
    <div class="statusbar"><span>9:41</span><span class="r">5G · 92%</span></div>

    <div class="body">
      <div class="illus"><img src="assets/review-complete-illust.png" alt="복습을 마친 사장 — 합장하고 주먹밥과 차 앞에 앉은 고양이"></div>

      <h1 class="title">복습 완료!</h1>
      <p class="sub">남겨둔 12개 다시 다 외웠네. 수고했어.</p>

      <div class="metrics">
        <div class="metric"><span class="num">20개</span><span class="lab">완료</span></div>
        <div class="metric"><span class="num">0개</span><span class="lab">넘김</span></div>
      </div>

      <div class="grow"></div>

      <button class="cta">홈으로</button>
    </div>
  </div>
</body>
</html>
