<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0}</style>
</head>
<body>
<title>오니칸 — 재료 노출 & 기록 프로토타입</title>
<style>
@font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;src:url("../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Regular.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:500;font-style:normal;font-display:swap;src:url("../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Medium.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:600;font-style:normal;font-display:swap;src:url("../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-SemiBold.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:700;font-style:normal;font-display:swap;src:url("../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-Bold.woff2") format("woff2")}
@font-face{font-family:"Pretendard";font-weight:800;font-style:normal;font-display:swap;src:url("../_ds/tintin-design-system-0bedd68d-616c-4058-b2fa-e93785070703/assets/fonts/Pretendard-ExtraBold.woff2") format("woff2")}

/* ---------- Onikan tokens ---------- */
:root{
  --ink:#1D1D21; --body:#56565E; --mute:#8E8E97;
  --canvas:#FFFFFF; --softer:#F2F2F4; --soft:#E8E8EC; --pressed:#DCDCE2; --plate:#EDEDF1;
  --shadow:rgba(0,0,0,0.05);
  --primary:#EA580C; --on-primary:#FFFFFF; --tab-active:#C2410C;
  --secondary:#A3E635; --on-secondary:#1D1D21; --link:#C2410C; --success:#16A34A;
  /* studio chrome */
  --studio-bg:#DEDEE4; --studio-panel:#FFFFFF; --studio-line:#D2D2DA; --studio-mute:#71717A;
  --font:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#F7F7F9; --body:#A9A9B2; --mute:#71717A;
    --canvas:#1D1D21; --softer:#131316; --soft:#2B2B31; --pressed:#3E3E45; --plate:#EDEDF1;
    --shadow:rgba(0,0,0,0.4);
    --primary:#F97316; --on-primary:#1D1D21; --tab-active:#EA580C; --link:#F97316;
    --studio-bg:#0B0B0D; --studio-panel:#1D1D21; --studio-line:#2B2B31; --studio-mute:#8E8E97;
  }
}
:root[data-theme="dark"]{
  --ink:#F7F7F9; --body:#A9A9B2; --mute:#71717A;
  --canvas:#1D1D21; --softer:#131316; --soft:#2B2B31; --pressed:#3E3E45; --plate:#EDEDF1;
  --shadow:rgba(0,0,0,0.4);
  --primary:#F97316; --on-primary:#1D1D21; --tab-active:#EA580C; --link:#F97316;
  --studio-bg:#0B0B0D; --studio-panel:#1D1D21; --studio-line:#2B2B31; --studio-mute:#8E8E97;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  background:var(--studio-bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;
  min-height:100%;
  transition:background .3s ease;
}

/* ---------- studio chrome ---------- */
.toolbar{
  position:sticky;top:0;z-index:50;width:100%;
  display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  padding:14px 18px;
  background:color-mix(in srgb,var(--studio-bg) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--studio-line);
}
.brand{font-size:13px;font-weight:700;letter-spacing:.2px;margin-right:4px}
.brand span{color:var(--studio-mute);font-weight:500}
.seg{display:inline-flex;background:var(--studio-panel);border:1px solid var(--studio-line);border-radius:999px;padding:3px}
.seg button{
  font-family:inherit;font-size:13px;font-weight:600;color:var(--studio-mute);
  border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.2s;
}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--canvas)}
.iconbtn{
  width:36px;height:36px;border-radius:999px;border:1px solid var(--studio-line);
  background:var(--studio-panel);color:var(--ink);cursor:pointer;
  display:inline-grid;place-items:center;transition:.2s;
}
.iconbtn:hover{transform:translateY(-1px)}
.iconbtn:active{transform:translateY(0) scale(.96)}
.iconbtn svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ---------- stage ---------- */
.stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px;gap:16px}
.caption{max-width:360px;text-align:center;font-size:12.5px;line-height:1.6;color:var(--studio-mute)}
.caption b{color:var(--ink);font-weight:600}
.limekey{display:inline-flex;align-items:center;gap:5px}
.limedot{width:9px;height:9px;border-radius:999px;background:var(--secondary);display:inline-block}

/* ---------- phone ---------- */
.phone{
  width:375px;height:788px;flex:none;
  background:#0b0b0d;border-radius:46px;padding:10px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.06);
  position:relative;
}
.screen{
  position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;
  background:var(--softer);color:var(--ink);
  transition:background .3s ease;
}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#0b0b0d;border-radius:999px;z-index:40}
.statusbar{
  position:absolute;top:0;left:0;right:0;height:52px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 24px 0;font-size:14px;font-weight:600;color:var(--ink);pointer-events:none;
  font-variant-numeric:tabular-nums;
}

.view{position:absolute;inset:0;display:none}
.view.active{display:block}

/* type helpers */
.label{font-size:12px;font-weight:500;line-height:16px;letter-spacing:1.4px;text-transform:uppercase;color:var(--body)}
.d-xl{font-size:36px;font-weight:700;line-height:44px;letter-spacing:-.5px}
.d-md{font-size:24px;font-weight:700;line-height:32px}
.d-sm{font-size:20px;font-weight:600;line-height:28px}
.body-md{font-size:16px;font-weight:400;line-height:24px}
.body-sm{font-size:14px;font-weight:400;line-height:20px;color:var(--body)}
.tnum{font-variant-numeric:tabular-nums}

/* ============================================================
   SCREEN A — 학습 완료 / 재료 노출
============================================================ */
#viewA .scrollA{position:absolute;inset:0;padding:64px 20px 24px;display:flex;flex-direction:column}
#viewA .head .label{margin-bottom:6px}
#viewA .headline{margin-bottom:24px}

.ingredient-card{
  background:var(--canvas);border-radius:24px;padding:20px;
  box-shadow:var(--shadow) 0 6px 14px;
  display:flex;align-items:center;gap:18px;position:relative;overflow:visible;
}
.plate{
  position:relative;width:88px;height:88px;border-radius:18px;background:var(--plate);
  flex:none;display:grid;place-items:center;
}
.plate img{width:62px;height:62px;object-fit:contain;transform-origin:center bottom}
.badge{
  position:absolute;right:-8px;bottom:-8px;width:34px;height:34px;border-radius:999px;
  background:var(--secondary);display:grid;place-items:center;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.badge svg{width:18px;height:18px}
.badge .ring{
  position:absolute;inset:0;border-radius:999px;border:2px solid var(--secondary);
  pointer-events:none;opacity:0;
}
.spark{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:2px;background:var(--secondary);opacity:0;pointer-events:none}
.ing-meta{display:flex;flex-direction:column;gap:2px}
.ing-meta .label{color:var(--body)}
.ing-name{font-size:24px;font-weight:700;line-height:30px;color:var(--ink)}
.ing-desc{font-size:14px;line-height:20px;color:var(--body)}

.recipe{margin-top:28px}
.recipe-row{display:flex;align-items:baseline;justify-content:space-between}
.recipe-code{font-size:13px;font-weight:500;color:var(--body)}
.dots{display:flex;gap:8px;margin:12px 0 8px}
.dot{width:100%;height:12px;border-radius:6px;border:2px solid var(--pressed);background:transparent}
.dot.earned{border-color:var(--ink);background:var(--ink)}
.recipe-note{color:var(--body)}

.stats{margin-top:22px}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.stat-row + .stat-row{border-top:1px solid var(--pressed)}
.stat-row .k{font-size:16px;color:var(--ink)}
.stat-row .v{font-size:22px;font-weight:700;color:var(--ink)}
.stats-note{margin-top:14px;color:var(--body)}

#viewA .spacer{flex:1;min-height:16px}
.btn-primary{
  width:100%;border:0;cursor:pointer;font-family:inherit;
  background:var(--primary);color:var(--on-primary);
  font-size:18px;font-weight:600;line-height:24px;
  padding:20px;border-radius:999px;
}
.btn-primary:active{transform:scale(.99)}

/* --- Screen A animations --- */
#viewA.armed .plate img{opacity:0;transform:scale(.8)}
#viewA.armed .badge{opacity:0;transform:scale(.3)}
#viewA.armed .recipe,#viewA.armed .stats{opacity:0;transform:translateY(10px)}
#viewA.armed .stats-note{opacity:0}
#viewA.armed .btn-primary{opacity:0;transform:translateY(24px)}
#viewA.armed .dot.earned{border-color:var(--pressed);background:transparent}

#viewA.play .plate img{animation:popIn .42s cubic-bezier(.34,1.56,.64,1) .05s both}
#viewA.play .badge{animation:badgePop .44s cubic-bezier(.34,1.56,.64,1) .34s both}
#viewA.play .badge .ring{animation:ringPulse .7s ease-out .42s 1 both}
#viewA.play .badge .check{stroke-dasharray:20;stroke-dashoffset:20;animation:checkDraw .3s ease-out .5s both}
#viewA.play .spark{animation:sparkFly .5s ease-out .42s both}
#viewA.play .recipe{animation:riseIn .5s ease-out .55s both}
#viewA.play .dot.earned{animation:dotEarn .6s ease-out .7s both}
#viewA.play .stats{animation:riseIn .5s ease-out .8s both}
#viewA.play .stats-note{animation:fadeIn .4s ease-out 1.15s both}
#viewA.play .btn-primary{animation:ctaUp .45s cubic-bezier(.22,1,.36,1) 1.25s both}

@keyframes popIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes badgePop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes ringPulse{0%{opacity:.55;transform:scale(.7)}100%{opacity:0;transform:scale(2.1)}}
@keyframes checkDraw{to{stroke-dashoffset:0}}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes ctaUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotEarn{0%{border-color:var(--pressed);background:transparent}45%{border-color:var(--secondary);background:var(--secondary)}100%{border-color:var(--ink);background:var(--ink)}}
@keyframes sparkFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(1)}}

/* ============================================================
   SCREEN B — 기록
============================================================ */
#viewB .hdr{
  position:absolute;top:0;left:0;right:0;height:100px;z-index:20;pointer-events:none;
}
#viewB .hdr .bar{
  position:absolute;left:0;right:0;top:0;height:96px;
  background:color-mix(in srgb,var(--softer) 90%,transparent);
  backdrop-filter:blur(10px);
  opacity:0;transition:opacity .2s ease;
  border-bottom:1px solid transparent;
}
#viewB .hdr.stuck .bar{opacity:1;border-bottom-color:var(--pressed)}
#viewB .close{
  position:absolute;left:20px;top:56px;width:40px;height:40px;border-radius:999px;
  background:var(--canvas);color:var(--ink);border:0;display:grid;place-items:center;
  box-shadow:var(--shadow) 0 4px 10px;cursor:pointer;pointer-events:auto;z-index:25;
}
#viewB .close svg{width:18px;height:18px}
#viewB .inlineTitle{
  position:absolute;left:0;right:0;top:60px;text-align:center;
  font-size:17px;font-weight:700;color:var(--ink);opacity:0;transform:translateY(4px);
}

#viewB .scrollB{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:52px 20px 32px;-webkit-overflow-scrolling:touch}
#viewB .scrollB::-webkit-scrollbar{width:0}
#viewB .bigtitle{font-size:36px;font-weight:700;line-height:44px;letter-spacing:-.5px;margin:56px 0 24px;transform-origin:left center}

#viewB .card{background:var(--canvas);border-radius:22px;box-shadow:var(--shadow) 0 6px 14px}
#viewB .stack{display:flex;flex-direction:column;gap:28px}

/* test score */
.score-card{display:flex;align-items:center;gap:14px;padding:14px 16px}
.score-ic{width:46px;height:46px;border-radius:14px;background:rgba(163,230,53,.22);display:grid;place-items:center;flex:none}
.score-ic img{width:28px;height:28px;display:block}
.score-main{flex:1;display:flex;flex-direction:column;gap:2px}
.score-main .v{font-size:20px;font-weight:700}
.score-main .k{font-size:14px;color:var(--body)}
.score-main .k .date{color:var(--mute)}
.chev{color:var(--mute)}
.chev svg{width:20px;height:20px}

/* 단골 도장 카드 (구 week-row 스트릭 → 오니기리 도장 그리드) */
.stamp-card{padding:18px 20px 20px}
.stamp-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.cal{width:29px;height:30px;flex:none;display:block}
.stamp-title{font-size:18px;font-weight:700}
.stamp-div{border-top:1px dashed var(--pressed);margin:0 0 16px}
.stamp-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px}
.stamp{aspect-ratio:1;background-repeat:no-repeat;background-position:center;background-size:contain}
.stamp.on{background-image:url(assets/stamp-earned.png)}
.stamp.off{background-image:url(assets/stamp-locked.png)}
.stamp-foot{margin-top:16px;font-size:13px;color:var(--body)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--canvas);border-radius:18px;padding:16px 16px 18px;box-shadow:var(--shadow) 0 6px 14px;position:relative;min-height:96px;display:flex;flex-direction:column}
.tile .v{display:block;font-size:28px;font-weight:800;line-height:1;letter-spacing:-.5px}
.tile .k{display:block;margin-top:8px;font-size:14px;color:var(--body)}
.tile .tic{position:absolute;right:14px;top:14px;color:var(--body)}
.tile .tic svg{width:22px;height:22px}
.tile .tic-jp{font-size:20px;font-weight:700;line-height:1;color:var(--ink)}

/* distribution */
.dist-card{padding:22px 20px 20px}
.dist-card h3{font-size:18px;font-weight:700;line-height:24px}
.dist-card .sub{margin-top:4px;font-size:14px;color:var(--body)}
/* 점수 분포 (구 곡선 → 막대 그래프) */
.bars{position:relative;margin:20px 0 8px;height:150px;display:flex;align-items:flex-end;gap:5px}
.bar{flex:1;background:var(--pressed);border-radius:5px 5px 0 0;position:relative;transform-origin:bottom center}
.bar.you{background:var(--primary)}
.barspace{flex:1}
.bar .you-lab{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--primary)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--body);margin-top:6px}
.axis .mid{color:var(--mute)}
.dist-cta{margin-top:18px}
.dist-cta button{
  width:100%;font-family:inherit;font-size:17px;font-weight:600;color:var(--canvas);background:var(--ink);
  border:0;border-radius:999px;padding:16px 26px;cursor:pointer;
}
.dist-cta button:active{transform:scale(.99)}

/* --- Screen B animations --- */
#viewB.armed .anim{opacity:0;transform:translateY(12px)}
#viewB.play .anim{animation:riseIn .5s ease-out both;animation-delay:var(--d,0s)}
/* 도장 pop-in (구 day-check와 동일 badgePop 재사용) */
#viewB.armed .stamp.on{transform:scale(.3);opacity:.001}
#viewB.play .stamp.on{animation:badgePop .44s cubic-bezier(.34,1.56,.64,1) both;animation-delay:var(--dd,.5s)}
/* 막대 rise (구 곡선 drawLR 대체) + 나 라벨 pop(구 youLabIn 유지) */
#viewB.armed .bar{transform:scaleY(0)}
#viewB.play .bar{animation:barRise .5s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--bd,.5s)}
#viewB.armed .bar .you-lab{opacity:0;transform:translateX(-50%) translateY(6px) scale(.4)}
#viewB.play .bar .you-lab{animation:youLabIn .42s cubic-bezier(.34,1.56,.64,1) 1.15s both}
@keyframes barRise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes youLabIn{from{opacity:0;transform:translateX(-50%) translateY(6px) scale(.4)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

@media (prefers-reduced-motion:reduce){
  #viewA.play *,#viewB.play *{animation:none!important}
  #viewA.armed .plate img,#viewA.armed .badge,#viewA.armed .recipe,#viewA.armed .stats,
  #viewA.armed .stats-note,#viewA.armed .btn-primary,#viewA.armed .dot.earned{opacity:1!important;transform:none!important}
  #viewA.armed .dot.earned{border-color:var(--ink);background:var(--ink)}
  #viewB.armed .anim,#viewB.armed .stamp.on,#viewB.armed .bar,#viewB.armed .bar .you-lab{opacity:1!important;transform:none!important}
  #viewB.armed .bar .you-lab{transform:translateX(-50%)!important}
}

@media (max-width:440px){
  .phone{transform:scale(.92);transform-origin:top center;margin-bottom:-60px}
}
</style>

<header class="toolbar">
  <div class="brand">오니칸 <span>· 인터랙션 프로토타입</span></div>
  <div class="seg" role="tablist" aria-label="화면 선택">
    <button role="tab" aria-selected="true" data-view="A">학습 완료 · 재료 노출</button>
    <button role="tab" aria-selected="false" data-view="B">기록</button>
  </div>
  <button class="iconbtn" id="replay" title="다시 재생" aria-label="다시 재생">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
  <button class="iconbtn" id="theme" title="테마 전환" aria-label="테마 전환">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<main class="stage">
  <div class="phone">
    <div class="screen">
      <div class="notch"></div>
      <div class="statusbar"><span>9:41</span><span>5G · 92%</span></div>

      <!-- ============ SCREEN A ============ -->
      <section class="view active" id="viewA">
        <div class="scrollA">
          <div class="head">
            <div class="label">오늘의 학습</div>
            <h1 class="d-xl headline">다 했어요</h1>
          </div>

          <div class="ingredient-card">
            <div class="plate">
              <img id="ingImg" alt="쌀" src="../ingredients/rice.png">
              <div class="badge">
                <span class="ring"></span>
                <svg viewBox="0 0 24 24" fill="none" stroke="var(--on-secondary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="check" d="M5 13l4 4L19 7"/></svg>
              </div>
              <i class="spark" style="--sx:-34px;--sy:-30px"></i>
              <i class="spark" style="--sx:30px;--sy:-34px"></i>
              <i class="spark" style="--sx:-40px;--sy:14px"></i>
              <i class="spark" style="--sx:38px;--sy:20px"></i>
              <i class="spark" style="--sx:0px;--sy:-44px"></i>
            </div>
            <div class="ing-meta">
              <div class="label">새 재료</div>
              <div class="ing-name">쌀</div>
              <div class="ing-desc">사장이 재료를 하나 건넸어요</div>
            </div>
          </div>

          <div class="recipe">
            <div class="recipe-row">
              <span class="d-sm">참치마요</span>
              <span class="recipe-code tnum"><span id="recipeCount">1</span> / 4</span>
            </div>
            <div class="dots">
              <span class="dot earned"></span>
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
            <div class="recipe-note body-sm">완성까지 세 번 남았어요</div>
          </div>

          <div class="stats">
            <div class="stat-row">
              <span class="k">새로 배운 단어</span>
              <span class="v tnum" data-count="12">12</span>
            </div>
            <div class="stat-row">
              <span class="k">아직이라고 표시한 단어</span>
              <span class="v tnum">3</span>
            </div>
          </div>
          <div class="stats-note body-sm">오늘 외운 12개는 내일 다시 확인해요.</div>

          <div class="spacer"></div>
          <button class="btn-primary">영수증 받고 마치기</button>
        </div>
      </section>

      <!-- ============ SCREEN B ============ -->
      <section class="view" id="viewB">
        <div class="hdr" id="hdrB">
          <div class="bar"></div>
          <button class="close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <div class="inlineTitle" id="inlineTitle">기록</div>
        </div>
        <div class="scrollB" id="scrollB">
          <h1 class="bigtitle" id="bigTitle">기록</h1>

          <div class="stack">
            <!-- test score -->
            <div class="card score-card anim" style="--d:.05s">
              <div class="score-ic">
                <img src="assets/icon-graph.svg" alt="" width="28" height="28">
              </div>
              <div class="score-main">
                <span class="v tnum"><span data-count="12">12</span>/12</span>
                <span class="k">테스트 점수 <span class="date">2026.08.20</span></span>
              </div>
              <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
            </div>

            <!-- 단골 도장 카드 (구 스트릭 week-row → 오니기리 도장 그리드) -->
            <div class="card stamp-card anim" style="--d:.12s">
              <div class="stamp-head">
                <img class="cal" src="assets/icon-calendar.svg" alt="">
                <span class="stamp-title">단골 6일차</span>
              </div>
              <div class="stamp-div"></div>
              <div class="stamp-grid" id="stampGrid"></div>
              <div class="stamp-foot">단골 혜택 · 다음 학습 재료 2배</div>
            </div>

            <!-- stat tiles -->
            <div class="tiles">
              <div class="tile anim" style="--d:.18s"><span class="v tnum" data-count="55">55</span><span class="k">읽은 단어</span><span class="tic tic-jp">あ</span></div>
              <div class="tile anim" style="--d:.24s"><span class="v tnum" data-count="55">55</span><span class="k">복습</span><span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span></div>
              <div class="tile anim" style="--d:.30s"><span class="v tnum" data-count="55">55</span><span class="k">다시 본 것</span><span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span></div>
              <div class="tile anim" style="--d:.36s"><span class="v tnum" data-count="55">55</span><span class="k">학습</span><span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 2.5 6 2.5s6-1.5 6-2.5v-5"/></svg></span></div>
            </div>

            <!-- 점수 분포 (구 분포 곡선 → 막대 그래프) -->
            <div class="card dist-card anim" style="--d:.42s">
              <h3>내 학습 점수 분포</h3>
              <div class="sub">지난 학습 기록의 <span class="tnum" data-count="33">33</span>%보다 높아요</div>
              <div class="bars" id="bars"></div>
              <div class="axis"><span>0%</span><span class="mid">평균 97%</span><span>100%</span></div>
              <div class="dist-cta"><button>지금 연습하기</button></div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <p class="caption" id="cap"></p>
</main>

<script>
const root=document.documentElement;
const mql=window.matchMedia('(prefers-color-scheme:dark)');
root.dataset.theme=mql.matches?'dark':'light';
const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

// theme toggle
document.getElementById('theme').addEventListener('click',()=>{
  root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
});

const viewA=document.getElementById('viewA');
const viewB=document.getElementById('viewB');
const cap=document.getElementById('cap');
let current='A';

// build 단골 도장 그리드 (10칸, 6 earned) — 진입 시 도장 pop-in(구 스트릭 체크와 동일 badgePop)
const STAMP_TOTAL=10, STAMP_EARNED=6;
const stampGrid=document.getElementById('stampGrid');
stampGrid.innerHTML=Array.from({length:STAMP_TOTAL},(_,i)=>
  `<div class="stamp ${i<STAMP_EARNED?'on':'off'}" style="--dd:${(.5+i*.05).toFixed(2)}s"></div>`).join('');

// build 점수 분포 막대 — 나(오렌지) 강조. 높이(%)는 Figma 분포 근사. 진입 시 아래→위 rise
const barData=[0,0,10,14,11,0,0,30,52,74,96,70,44];  // index 10 = 나
const YOU_IDX=10;
const bars=document.getElementById('bars');
bars.innerHTML=barData.map((h,i)=>{
  if(h===0) return `<i class="barspace"></i>`;
  const you=i===YOU_IDX;
  return `<div class="bar${you?' you':''}" style="height:${h}%;--bd:${(.5+i*.05).toFixed(2)}s">${you?'<span class="you-lab">나</span>':''}</div>`;
}).join('');

const captions={
  A:'학습을 마친 순간, 사장이 재료를 건네는 <b>보상 릴리즈</b>. <span class="limekey"><span class="limedot"></span>라임</span>은 체크 뱃지·획득한 진행 칸의 “켜졌다 잉크로 가라앉는” 순간에만 — 콘페티 없이 절제.',
  B:'스크롤하면 라지 타이틀 <b>기록</b>이 상단 인라인 타이틀로 축소돼요. 숫자 카운트업 · <b>단골 도장</b> pop-in · <b>막대</b> 아래→위 rise · <b style="color:var(--primary)">나</b> 강조. 오렌지 액션은 없고 <b>지금 연습하기</b>는 잉크.'
};

function setCaption(){cap.innerHTML=captions[current]}

// counters
function runCounters(scope){
  if(reduce) return;
  scope.querySelectorAll('[data-count]').forEach(el=>{
    const target=+el.dataset.count;
    const dur=550, t0=performance.now();
    el.textContent='0';
    function step(now){
      const p=Math.min((now-t0)/dur,1);
      const e=1-Math.pow(1-p,3);
      el.textContent=Math.round(target*e);
      if(p<1) requestAnimationFrame(step);
      else el.textContent=target;
    }
    requestAnimationFrame(step);
  });
}

function play(which){
  const v=which==='A'?viewA:viewB;
  v.classList.remove('play');
  v.classList.add('armed');
  // force reflow
  void v.offsetWidth;
  if(reduce){ v.classList.remove('armed'); runCounters(v); return; }
  v.classList.add('play');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ v.classList.remove('armed'); }));
  // counters timed to their reveal
  if(which==='A'){
    setTimeout(()=>runCounters(viewA),700);
  }else{
    setTimeout(()=>runCounters(viewB),150);
  }
}

// view switching
document.querySelectorAll('.seg button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-selected','false'));
    b.setAttribute('aria-selected','true');
    current=b.dataset.view;
    viewA.classList.toggle('active',current==='A');
    viewB.classList.toggle('active',current==='B');
    setCaption();
    if(current==='B'){document.getElementById('scrollB').scrollTop=0;updateHeader();}
    play(current);
  });
});

document.getElementById('replay').addEventListener('click',()=>play(current));

// Screen B: large-title collapse on scroll
const scrollB=document.getElementById('scrollB');
const bigTitle=document.getElementById('bigTitle');
const inlineTitle=document.getElementById('inlineTitle');
const hdrB=document.getElementById('hdrB');
function updateHeader(){
  const y=scrollB.scrollTop;
  const t=Math.min(y/48,1);
  bigTitle.style.opacity=String(1-t);
  bigTitle.style.transform=`translateY(${-t*8}px) scale(${1-t*0.12})`;
  inlineTitle.style.opacity=String(t);
  inlineTitle.style.transform=`translateY(${(1-t)*4}px)`;
  hdrB.classList.toggle('stuck',y>6);
}
scrollB.addEventListener('scroll',updateHeader,{passive:true});
// (구 positionYou: 곡선 위 '나' 마커 좌표 계산 — 막대 그래프로 바뀌며 불필요, '나' 라벨은 오렌지 막대의 자식으로 배치)

// init
setCaption();
play('A');
</script>

</body>
</html>
